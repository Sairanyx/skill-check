# Skill Check – services on the Verda A100 in Helsinki (FIN-01)
# Gemma 4 26B-A4B = privacy guard + agents. Whisper = speech-to-text.
# Only bound to 127.0.0.1: reachable by the app on this box or via SSH tunnel, never from the internet.
services:
  gemma:
    image: vllm/vllm-openai:v0.33.0
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model=google/gemma-4-26B-A4B-it # 26B mixture-of-experts, ~4B active per token: smarter, about as fast
      - --served-model-name=gemma
      - --max-model-len=16384
      - --gpu-memory-utilization=0.80
      - --limit-mm-per-prompt={"image":0}
      - --api-key=${VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 40

  # Whisper = speech-to-text for fi/sv/en (Gemma 4 refused Finnish/Swedish audio in testing).
  whisper:
    image: vllm/vllm-openai:v0.33.0
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model=openai/whisper-large-v3-turbo
      - --served-model-name=whisper
      - --gpu-memory-utilization=0.15
      - --api-key=${VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 40

  # The web app. Talks to gemma/whisper over the internal Docker network (never the internet).
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      - GUARD_BASE_URL=http://gemma:8000/v1
      - ASR_BASE_URL=http://whisper:8000/v1
      - GUARD_MODEL=gemma
      - ASR_MODEL=whisper
    depends_on: [gemma, whisper]

  # Interview panel (panel/, docs/PANEL_API.md): three Gemini 4 models deliberate after every answer.
  # Internal only (no published port). The app uses it when .env has PANEL_URL=http://panel:8010 and PANEL_API_KEY.
  # Needs GEMINI_API_KEY, PANEL_API_KEY and DATABASE_URL in .env (it adds one table, panel_interview).
  panel:
    build: ./app/panel
    restart: unless-stopped
    env_file: .env

  # HTTPS (ports 80/443 are the only ones open in the firewall besides SSH).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_HOST=${SITE_HOST}
      - REDIRECT_HOSTS=${REDIRECT_HOSTS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  hf-cache:
  caddy-data:
