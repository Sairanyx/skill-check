# Judge server (second Verda GPU, FIN-01, Spot): Mistral Small 3.2 24B = judge 2 on the scoring panel.
# It only receives pseudonymised quotes + anchors from the main server, never audio or raw answers.
# Reachable only from the main server over Verda's network (firewall rule in setup.sh) and only with the API key.
# The model is downloaded once (see setup.sh), then vLLM runs offline: the judge needs no internet.
services:
  mistral:
    image: vllm/vllm-openai:v0.33.0
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HF_HUB_OFFLINE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model=mistralai/Mistral-Small-3.2-24B-Instruct-2506 # Mistral AI (France), open weights, Apache 2.0
      - --served-model-name=mistral
      - --tokenizer-mode=mistral
      - --config-format=mistral
      - --load-format=mistral
      - --quantization=fp8 # 24B in ~25 GB, fits the 40 GB A100
      - --max-model-len=16384
      - --gpu-memory-utilization=0.90
      - --limit-mm-per-prompt={"image":0}
      - --api-key=${VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 60

volumes:
  hf-cache:
