# Every push and pull request: lint, typecheck, unit tests, production build.
# Runs on CRACI runners (repository variable RUNNER=craci). Without the variable it falls back to GitHub runners.
# To change it, set the repository variable RUNNER
# (Settings → Secrets and variables → Actions → Variables) to the runner label CRACI gives you.
name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch: # run by hand from the Actions tab

jobs:
  check:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # Placeholders: the build and tests need no real database, keys or AI.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-0000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
